<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>📜 A Vintage Voice Note for You 💜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Georgia', serif;
            background: radial-gradient(circle at 30% 20%, #3e2a2a, #2a1e1a, #1a120e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* floating vintage elements (hearts turned into old‑styled symbols) */
        .floating-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .float-item {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.4;
            animation: floatUp 18s infinite linear;
            filter: sepia(0.5) blur(0.3px);
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-20vh) rotate(15deg); opacity: 0; }
        }

        /* main vintage box (old paper look) */
        .vintage-box {
            position: relative;
            z-index: 20;
            max-width: 880px;
            width: 90%;
            background: #fbf5e8;
            background-image: 
                repeating-linear-gradient(45deg, rgba(180, 140, 100, 0.08) 0px, rgba(180,140,100,0.08) 2px, transparent 2px, transparent 8px),
                radial-gradient(circle at 20% 30%, rgba(200,170,120,0.1) 2%, transparent 3%);
            border-radius: 8px 40px 40px 40px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3), inset 0 0 0 2px #fef7e0, inset 0 0 15px rgba(0,0,0,0.05);
            padding: 2rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            transition: all 0.2s;
            border: 1px solid #d9c7a7;
            transform: rotate(0.5deg);
        }
        /* curled corners effect */
        .vintage-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #e6d5b8 0%, #cbbf9e 100%);
            border-radius: 0 0 30px 0;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.1));
            pointer-events: none;
        }
        .vintage-box::after {
            content: "";
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 50px;
            background: linear-gradient(315deg, #e6d5b8 0%, #cbbf9e 100%);
            border-radius: 30px 0 0 0;
            filter: drop-shadow(-2px -2px 3px rgba(0,0,0,0.1));
            pointer-events: none;
        }

        /* wax seal (optional) */
        .wax-seal {
            position: absolute;
            bottom: 15px;
            left: 25px;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle at 30% 30%, #b33b2c, #7a2a1a);
            border-radius: 50%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2), inset 0 2px 3px rgba(255,255,200,0.4);
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Dancing Script', cursive;
            font-size: 1.3rem;
            color: #f9e0a0;
            text-shadow: 1px 1px 0 #4a1a0a;
        }
        .wax-seal::after {
            content: "💜";
            font-size: 1.8rem;
            position: relative;
            top: 2px;
        }

        /* disc (vinyl) – vintage style */
        .disc-container {
            flex: 0 0 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .vinyl {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 35% 35%, #3a2e28, #1f1814);
            border-radius: 50%;
            box-shadow: 0 15px 25px rgba(0,0,0,0.4), inset 0 0 0 4px #c9b07c, inset 0 0 0 8px #aa8b5a;
            position: relative;
            animation: spinDisc 2s linear infinite;
            animation-play-state: paused;
            transition: filter 0.2s;
        }
        .vinyl::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 36px;
            height: 36px;
            background: radial-gradient(circle, #e8c88a, #b87e3a);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 3px #f7e5b0;
        }
        .vinyl::after {
            content: "♫";
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
            color: #a66b38;
            background: #fdf3df;
            padding: 4px 12px;
            border-radius: 50px;
            font-family: monospace;
            white-space: nowrap;
            box-shadow: inset 0 0 3px #d9b48b, 0 2px 6px rgba(0,0,0,0.1);
        }
        @keyframes spinDisc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .vinyl.spinning {
            animation-play-state: running;
        }

        /* right side content (vintage paper) */
        .voice-content {
            flex: 1;
            text-align: center;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #8b5a3a;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #eeddbb;
            border-bottom: 2px dotted #c9ae7a;
            display: inline-block;
            padding-bottom: 5px;
        }
        .audio-player {
            background: rgba(230, 210, 170, 0.4);
            border-radius: 60px;
            padding: 0.8rem 1rem;
            margin: 1rem 0;
            border: 1px solid #e1cca8;
            box-shadow: inset 0 0 6px #e7d5b0, 0 4px 10px rgba(0,0,0,0.05);
        }
        audio {
            width: 100%;
            outline: none;
            border-radius: 50px;
            filter: sepia(0.2);
        }
        .message {
            font-size: 0.95rem;
            color: #5d3e2a;
            background: rgba(250, 240, 215, 0.8);
            padding: 10px 15px;
            border-radius: 50px;
            margin: 0.8rem 0;
            font-style: italic;
            border-left: 4px solid #c2a36b;
            border-right: 4px solid #c2a36b;
        }
        .next-btn {
            background: #c6a27a;
            border: none;
            padding: 8px 24px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #2e241f;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1px;
        }
        .next-btn:hover {
            background: #b58b5c;
            transform: translateY(-2px);
            color: white;
        }
        footer {
            margin-top: 1.2rem;
            font-size: 0.65rem;
            color: #a8825a;
            text-align: center;
        }

        @media (max-width: 680px) {
            .vintage-box { flex-direction: column; padding: 1.5rem; gap: 1rem; }
            .disc-container { flex: none; }
            .vinyl { width: 120px; height: 120px; }
            .wax-seal { width: 45px; height: 45px; bottom: 8px; left: 12px; }
            h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="floating-bg" id="floatingBg"></div>

<div class="vintage-box">
    <!-- wax seal decoration -->
    <div class="wax-seal"></div>

    <!-- left: vintage disc -->
    <div class="disc-container">
        <div class="vinyl" id="vinylDisc"></div>
    </div>

    <!-- right: voice note -->
    <div class="voice-content">
        <h2>💜 A SPECIAL MSG FOR U 💜</h2>
        <div class="audio-player">
            <audio id="voiceAudio" controls preload="auto">
                <source src="new video one voice.m4a" type="audio/mpeg">
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>
        </div>
        <div class="message">
            ✨ Press play, and the old record will spin – just like memories. ✨
        </div>
        <a href="FINAL.HTML" class="next-btn">
            <i class="fas fa-arrow-right"></i> Continue the Journey →
        </a>
        <footer>📜 Every word, like old parchment, holds a story of us.</footer>
    </div>
</div>

<script>
    // floating background (vintage style elements)
    const bg = document.getElementById('floatingBg');
    const icons = ['🌹', '📜', '✨', '💌', '🎞️', '🕯️', '💜', '⭐', '🌸'];
    for (let i = 0; i < 80; i++) {
        let el = document.createElement('div');
        el.classList.add('float-item');
        el.innerHTML = icons[Math.floor(Math.random() * icons.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.fontSize = (Math.random() * 26 + 12) + 'px';
        el.style.animationDuration = (Math.random() * 18 + 8) + 's';
        el.style.animationDelay = Math.random() * 14 + 's';
        bg.appendChild(el);
    }

    // disc spin control
    const audioEl = document.getElementById('voiceAudio');
    const vinyl = document.getElementById('vinylDisc');

    audioEl.addEventListener('play', () => {
        vinyl.classList.add('spinning');
        burstConfetti();
    });
    audioEl.addEventListener('pause', () => vinyl.classList.remove('spinning'));
    audioEl.addEventListener('ended', () => vinyl.classList.remove('spinning'));

    // gentle confetti
    function burstConfetti() {
        const canvas = document.createElement('canvas');
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.pointerEvents = 'none';
        canvas.style.zIndex = '9999';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for (let i = 0; i < 140; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                size: Math.random() * 7 + 3,
                color: `hsl(${Math.random() * 50 + 20}, 70%, 55%)`,
                speedY: Math.random() * 6 + 3,
                speedX: (Math.random() - 0.5) * 3
            });
        }
        let anim;
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size / 1.5);
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y > canvas.height + 50) p.y = -30;
            }
            anim = requestAnimationFrame(draw);
        }
        draw();
        setTimeout(() => { cancelAnimationFrame(anim); canvas.remove(); }, 2500);
    }
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</body>
</html>
